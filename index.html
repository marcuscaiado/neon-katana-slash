<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Neon Katana Slash ⚔️🍉 — 60s Time Attack</title>
  <script src="arcade-sound-engine.js"></script>
  <script src="arcade-difficulty.js"></script>
  <script src="arcade-leaderboard.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; touch-action:none; user-select:none; }
    body { background:#070916; color:#fff; font-family:'Segoe UI',sans-serif; overflow:hidden; display:flex; justify-content:center; align-items:center; height:100vh; }
    #canvas-container { position:relative; width:100vw; height:100vh; max-width:800px; }
    @media (max-width: 600px) { .hud { z-index:20;  font-size:15px;  } .arcade-nav { font-size:11px; padding:6px 10px; } }
    canvas:not(#dopamine-confetti-canvas) { width:100%; height:100%; display:block; background:#070916; cursor:crosshair; }
    .arcade-nav { position:absolute; top:16px; right:16px; z-index:100; background:rgba(0,0,0,0.7); border:2px solid #00f5ff; color:#00f5ff; padding:8px 16px; border-radius:8px; font-weight:bold; text-decoration:none; font-size:13px; box-shadow:0 0 15px rgba(0,245,255,0.4); }
    .hud { z-index:20;  position:absolute; top:16px; left:16px; font-family:monospace; font-size:19px; font-weight:bold; color:#00f5ff; text-shadow:0 0 10px #00f5ff; pointer-events:none;  }
    .time-badge { color:#ffd32a; text-shadow:0 0 10px #ffd32a; }
    .hint { position:absolute; bottom:20px; left:50%; transform:translateX(-50%); font-size:14px; color:#94a3b8; pointer-events:none; font-weight:bold; text-align:center; }
    #modal { position:absolute; inset:0; background:rgba(0,0,0,0.88); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; z-index:200; }
    #modal h1 { color:#00f5ff; font-size:38px; text-shadow:0 0 20px #00f5ff; text-align:center; }
    .btn { background:linear-gradient(135deg,#00f5ff,#ff007f); border:none; color:#000; padding:12px 32px; font-size:18px; font-weight:bold; border-radius:8px; cursor:pointer; text-decoration:none; box-shadow:0 0 20px rgba(0,245,255,0.5); }
  
/* Universal Mobile Touch & Top Navigation Safeguards */
.arcade-nav, .arcade-link, .nav-btn-arcade, .arcade-corner-btn, .arcade-btn, .btn-arcade, a[href*="arcad"], #modal a, #modal button, .modal a, .modal button, #game-over-modal a, #game-over-modal button {
  pointer-events: auto !important;
  touch-action: auto !important;
  cursor: pointer !important;
  -webkit-tap-highlight-color: rgba(0, 245, 255, 0.4);
}

</style>
</head>
<body>
  <div id="canvas-container">
    <a href="https://marcuscaiado.github.io/marcus-arcade/" class="arcade-nav" target="_top" onclick="if(window.top){window.top.location.href=this.href;return false;}" ontouchend="if(window.top){window.top.location.href=this.href;return false;}">🕹️ Arcade Hub</a>
    <div class="hud">SCORE: <span id="score-val">0</span> | TIME: <span id="time-val" class="time-badge">60s</span> | COMBO: <span id="combo-val">0x</span></div>
    <div class="hint">⏱️ 60s Time Attack! Slice fruits across wide arcs, build combos, avoid bombs 💣</div>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    
    <div id="modal">
      <h1 id="modal-title">NEON KATANA SLASH ⚔️</h1>
      <p style="font-size:15px; color:#aaa; text-align:center;" id="modal-sub">60-Second Time Attack! Maximize your score for the Global Leaderboard.</p>
      <button class="btn" onclick="startGame()">START 60s MATCH ⏱️</button>
      <a href="https://marcuscaiado.github.io/marcus-arcade/" class="btn" style="background:#222; color:#fff; border:1px solid #00f5ff;" target="_top" onclick="if(window.top){window.top.location.href=this.href;return false;}" ontouchend="if(window.top){window.top.location.href=this.href;return false;}">ARCADE HUB 🕹️</a>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Audio SFX
    let audioCtx = null;
    function getAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); return audioCtx; }
    function playSliceSfx(pitch = 750) {
      try {
        const c = getAudio(); const osc = c.createOscillator(); const g = c.createGain();
        osc.type = 'triangle'; osc.frequency.setValueAtTime(pitch, c.currentTime);
        osc.frequency.exponentialRampToValueAtTime(180, c.currentTime + 0.14);
        g.gain.setValueAtTime(0.2, c.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.14);
        osc.connect(g); g.connect(c.destination); osc.start(); osc.stop(c.currentTime + 0.14);
      } catch(e){}
    }

    // 1. RICH VARIETY OF STANDARD ARCADE FRUITS (High frequency, diverse arcs)
    const STANDARD_FRUITS = [
      { name: 'Watermelon', emoji: '🍉', color: '#05ffa1', inner: '#ff007f', r: 34, pts: 50 },
      { name: 'Neon Orange', emoji: '🍊', color: '#ff9f43', inner: '#ffd32a', r: 30, pts: 75 },
      { name: 'Plasma Berry', emoji: '🍓', color: '#ff007f', inner: '#ff5e57', r: 26, pts: 100 },
      { name: 'Cyber Pineapple', emoji: '🍍', color: '#ffd32a', inner: '#05ffa1', r: 32, pts: 125 },
      { name: 'Golden Banana', emoji: '🍌', color: '#f1c40f', inner: '#ffffff', r: 28, pts: 150 },
      { name: 'Kiwi Slicer', emoji: '🥝', color: '#2ecc71', inner: '#27ae60', r: 27, pts: 175 },
      { name: 'Cyber Star', emoji: '⭐', color: '#00f5ff', inner: '#ffffff', r: 29, pts: 200 },
      { name: 'Dragonfruit Neo', emoji: '🐲', color: '#ff007f', inner: '#ffffff', r: 34, pts: 250 }
    ];

    // 2. RARE SPECIAL POWER-UPS (Low ratio, gated by cooldown & exponential decay)
    const UTILITY_POWERUPS = [
      { name: 'Freeze Clock', emoji: '❄️', color: '#00f5ff', inner: '#ffffff', r: 30, pts: 100, isFreeze: true },
      { name: 'Time Booster', emoji: '⏱️', color: '#ffd32a', inner: '#ffffff', r: 30, pts: 100, isTimePlus: true }
    ];

    let score = 0, timeLeft = 60, combo = 0, maxCombo = 0, comboTimer = 0, gameActive = false;
    let fruits = [];
    let fruitHalves = [];
    let particles = [];
    let slashPoints = [];
    let popups = [];
    let pendingSpawns = [];
    let isMouseDown = false;
    let waveTimer = 0;
    let timerInterval = null;
    let screenShake = 0;
    let freezeTimer = 0;
    let powerupCooldown = 0;

    function startGame() {
      if (window.ArcadeDifficulty) ArcadeDifficulty.reset();
      score = 0; timeLeft = 60; combo = 0; maxCombo = 0; comboTimer = 0; freezeTimer = 0;
      powerupCooldown = 300; // 5s initial buffer before any powerup can spawn
      fruits = []; fruitHalves = []; particles = []; slashPoints = []; popups = []; pendingSpawns = [];
      document.getElementById('score-val').textContent = '0';
      document.getElementById('time-val').textContent = '60s';
      document.getElementById('combo-val').textContent = '0x';
      document.getElementById('modal').style.display = 'none';
      gameActive = true;
      waveTimer = 15;

      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (!gameActive) return;
        timeLeft--;
        document.getElementById('time-val').textContent = timeLeft + 's';
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          finishMatch();
        }
      }, 1000);

      requestAnimationFrame(loop);
    }

    function addSlashPoint(x, y) {
      slashPoints.push({ x, y, life: 1 });
      checkSlice(x, y);
    }

    const getCanvasPos = (clientX, clientY) => {
      const rect = canvas.getBoundingClientRect();
      return {
        x: ((clientX - rect.left) / rect.width) * 800,
        y: ((clientY - rect.top) / rect.height) * 600
      };
    };

    window.addEventListener('mousedown', e => { isMouseDown = true; const p = getCanvasPos(e.clientX, e.clientY); addSlashPoint(p.x, p.y); });
    window.addEventListener('mousemove', e => { if (isMouseDown) { const p = getCanvasPos(e.clientX, e.clientY); addSlashPoint(p.x, p.y); } });
    window.addEventListener('mouseup', () => { isMouseDown = false; });

    window.addEventListener('touchstart', e => { isMouseDown = true; const p = getCanvasPos(e.touches[0].clientX, e.touches[0].clientY); addSlashPoint(p.x, p.y); }, { passive:false });
    window.addEventListener('touchmove', e => { if (e.target && e.target.closest && e.target.closest('a, button, .arcade-nav, #modal')) return; e.preventDefault(); const p = getCanvasPos(e.touches[0].clientX, e.touches[0].clientY); addSlashPoint(p.x, p.y); }, { passive:false });
    window.addEventListener('touchend', () => { isMouseDown = false; });

    function checkSlice(sx, sy) {
      for (let i = fruits.length - 1; i >= 0; i--) {
        const f = fruits[i];
        if (f.sliced) continue;
        const d = Math.hypot(sx - f.x, sy - f.y);
        // Generous blade slice radius
        if (d < f.r + 18) {
          f.sliced = true;

          const rect = canvas.getBoundingClientRect();
          const clientX = rect.left + (f.x / 800) * rect.width;
          const clientY = rect.top + (f.y / 600) * rect.height;

          if (f.isBomb) {
            // Hit Bomb: Devastating -30% score penalty + combo reset (eliminates brainless swiping)
            const penalty = Math.max(150, Math.round(score * 0.30));
            score = Math.max(0, score - penalty);
            combo = 0;
            document.getElementById('score-val').textContent = score;
            document.getElementById('combo-val').textContent = '0x';
            popups.push({ x: f.x, y: f.y, text: `-${penalty} BOMB! 💣`, color: '#ff0055', life: 1.2 });
            if (window.DopamineJuice) {
              window.DopamineJuice.spawnScore(clientX, clientY, `-${penalty} BOMB! 💣`, 1);
            }
            if (window.arcadeAudio) window.arcadeAudio.playSoftThud(1.8);
            screenShake = 24;

            for (let p=0; p<24; p++) {
              particles.push({ x: f.x, y: f.y, vx:(Math.random()-0.5)*12, vy:(Math.random()-0.5)*12, color:'#ff0055', life:1.2, r: 4 });
            }
          } else {
            // Sliced Fruit!
            combo++;
            if (combo > maxCombo) maxCombo = combo;
            comboTimer = 45; // 0.75s combo link window
            const pts = f.pts * combo;
            score += pts;
            document.getElementById('score-val').textContent = score;
            document.getElementById('combo-val').textContent = combo + 'x';
            if (window.arcadeAudio) {
              window.arcadeAudio.playSlice(combo);
              window.arcadeAudio.playCollectStreak(combo);
            }

            if (f.isFreeze) {
              freezeTimer = 160; // ~2.6s Matrix Freeze (balanced duration)
              powerupCooldown = 750; // At least 12.5s before another powerup
              popups.push({ x: f.x, y: f.y - 20, text: '❄️ FREEZE TIME!', color: '#00f5ff', life: 1.2 });
              if (window.DopamineJuice) window.DopamineJuice.spawnScore(clientX, clientY, '❄️ FREEZE!', 3);
            } else if (f.isTimePlus) {
              timeLeft += 3; // +3s bonus
              powerupCooldown = 750;
              document.getElementById('time-val').textContent = timeLeft + 's';
              popups.push({ x: f.x, y: f.y - 20, text: '+3 SECONDS! ⏱️', color: '#ffd32a', life: 1.2 });
              if (window.DopamineJuice) window.DopamineJuice.spawnScore(clientX, clientY, '+3s ⏱️', 3);
            } else {
              popups.push({ x: f.x, y: f.y - 15, text: `+${pts} (${combo}x)`, color: f.color, life: 1 });
              if (window.DopamineJuice) window.DopamineJuice.spawnScore(clientX, clientY, `+${pts} (${combo}x)`, combo);
            }

            // Spawn 2 split halves flying apart
            fruitHalves.push({
              x: f.x - 8, y: f.y, vx: f.vx - 3.8, vy: f.vy - 1.8, rot: f.rot, rotSpeed: -0.09, r: f.r,
              color: f.color, inner: f.inner, emoji: f.emoji, side: -1
            });
            fruitHalves.push({
              x: f.x + 8, y: f.y, vx: f.vx + 3.8, vy: f.vy - 1.8, rot: f.rot, rotSpeed: 0.09, r: f.r,
              color: f.color, inner: f.inner, emoji: f.emoji, side: 1
            });

            // Glowing Splash Droplets
            for (let p=0; p<14; p++) {
              particles.push({
                x: f.x, y: f.y,
                vx: (Math.random()-0.5)*8,
                vy: (Math.random()-0.5)*8,
                color: f.inner,
                life: 1,
                r: Math.random() * 3.5 + 2
              });
            }
          }
        }
      }
    }

    // Launch authentic, wide-dispersion Fruit Ninja wave (More Fruits, RARE Powerups)
    function spawnWave() {
      const session = (window.ArcadeDifficulty && typeof window.ArcadeDifficulty.getSessionTier === 'function')
        ? ArcadeDifficulty.getSessionTier(60 - timeLeft, score, 2500)
        : { tier: (timeLeft < 25 ? 3 : (timeLeft < 45 ? 2 : 1)), multiplier: 1.0 };
      const tier = session.tier;
      const ddaMult = session.multiplier || 1.0;

      // MORE FRUITS: Tier 1: 4-6 fruits; Tier 2: 6-8 fruits; Tier 3: 7-10 fruits
      const minFruits = tier === 1 ? 4 : (tier === 2 ? 6 : 7);
      const maxFruits = tier === 1 ? 6 : (tier === 2 ? 8 : 10);
      const totalItems = Math.floor(Math.random() * (maxFruits - minFruits + 1)) + minFruits;

      // Bomb chance scales with tier (Tier 1: 20%, Tier 2: 38%, Tier 3: 52%)
      const bombChance = tier === 1 ? 0.20 : (tier === 2 ? 0.38 : 0.52);
      const bombCount = Math.random() < bombChance ? (tier === 3 && Math.random() < 0.35 ? 2 : 1) : 0;

      // STRICTLY CONTROLLED RARE POWER-UPS ("less power ratio"):
      // Max 1 per wave, requires cooldown <= 0, freezeTimer == 0, base chance ~4.5% decaying exponentially
      let hasPowerup = false;
      if (powerupCooldown <= 0 && freezeTimer <= 0) {
        const powerRatio = (window.ArcadeDifficulty && typeof window.ArcadeDifficulty.scaleDropRate === 'function')
          ? ArcadeDifficulty.scaleDropRate(0.048, 0.014, 0.012)
          : 0.035;
        if (Math.random() < powerRatio) {
          hasPowerup = true;
          powerupCooldown = 650; // At least 11 seconds cooldown
        }
      }

      // Pick trajectory formation: 0=Left->Right Cross, 1=Right->Left Cross, 2=Fountain, 3=Dual Flank
      const formation = Math.floor(Math.random() * 4);

      for (let i = 0; i < totalItems; i++) {
        let startX, targetApexX, targetApexY;

        if (formation === 0) {
          // Left-to-Right sweep
          startX = 60 + Math.random() * 220;
          targetApexX = 350 + Math.random() * 370;
          targetApexY = 120 + Math.random() * 180;
        } else if (formation === 1) {
          // Right-to-Left sweep
          startX = 520 + Math.random() * 220;
          targetApexX = 80 + Math.random() * 370;
          targetApexY = 120 + Math.random() * 180;
        } else if (formation === 2) {
          // Wide Fountain Spread
          startX = 260 + Math.random() * 280;
          targetApexX = 80 + (i / totalItems) * 640 + (Math.random() - 0.5) * 60;
          targetApexY = 110 + Math.random() * 160;
        } else {
          // Dual Flank Crossfire
          if (i % 2 === 0) {
            startX = 70 + Math.random() * 180;
            targetApexX = 360 + Math.random() * 280;
          } else {
            startX = 550 + Math.random() * 180;
            targetApexX = 160 + Math.random() * 280;
          }
          targetApexY = 130 + Math.random() * 170;
        }

        // Gravitational launch velocity calculation (Snappy arcade physics)
        const gravity = 0.155;
        const deltaY = 620 - targetApexY;
        const initialVy = -Math.sqrt(2 * gravity * deltaY) * (tier === 1 ? 0.98 : (tier === 2 ? 1.05 : 1.12));
        const timeToApex = Math.abs(initialVy) / gravity;
        const initialVx = (targetApexX - startX) / timeToApex;

        // Determine item type
        let isBomb = false;
        let fruitData;

        if (bombCount > 0 && (i === totalItems - 1 || (bombCount === 2 && i === Math.floor(totalItems / 2)))) {
          isBomb = true;
        } else if (hasPowerup && i === 0) {
          // Rare powerup: 50% freeze (if not frozen), 50% time booster
          const puIndex = (freezeTimer > 0) ? 1 : Math.floor(Math.random() * UTILITY_POWERUPS.length);
          fruitData = UTILITY_POWERUPS[puIndex];
          hasPowerup = false; // Only 1 power-up permitted per wave
        } else {
          fruitData = STANDARD_FRUITS[Math.floor(Math.random() * STANDARD_FRUITS.length)];
        }

        // Staggered stream launch delay (0ms to 240ms) for natural flowing cascades
        const delayFrames = Math.floor(i * (Math.random() * 4 + 2));
        pendingSpawns.push({
          delay: delayFrames,
          item: {
            x: startX, y: 620, vx: initialVx, vy: initialVy,
            r: isBomb ? 28 : fruitData.r,
            rot: Math.random() * Math.PI * 2,
            rotSpeed: (Math.random() - 0.5) * 0.06,
            isBomb,
            sliced: false,
            ...(isBomb ? { emoji: '💣' } : fruitData)
          }
        });
      }
    }

    function loop() {
      if (!gameActive) return;

      const timeScale = freezeTimer > 0 ? 0.45 : 1.0;
      if (freezeTimer > 0) freezeTimer--;
      if (powerupCooldown > 0) powerupCooldown--;

      // Process pending staggered spawns
      for (let i = pendingSpawns.length - 1; i >= 0; i--) {
        pendingSpawns[i].delay--;
        if (pendingSpawns[i].delay <= 0) {
          fruits.push(pendingSpawns[i].item);
          pendingSpawns.splice(i, 1);
        }
      }

      // Continuous Wave Spawning
      waveTimer--;
      if (waveTimer <= 0) {
        spawnWave();
        const baseInterval = 72 + Math.floor(Math.random() * 22);
        const scaleFn = (window.ArcadeDifficulty && typeof window.ArcadeDifficulty.scaleInterval === 'function')
          ? ArcadeDifficulty.scaleInterval
          : null;
        waveTimer = scaleFn ? scaleFn(baseInterval, score, 2500, 46, 1.8) : baseInterval;
      }

      // Combo Reset Timer
      if (comboTimer > 0) {
        comboTimer--;
        if (comboTimer <= 0) {
          combo = 0;
          document.getElementById('combo-val').textContent = '0x';
        }
      }

      // Update Fruits (Snappy, authentic Fruit Ninja arc gravity)
      for (let i = fruits.length - 1; i >= 0; i--) {
        const f = fruits[i];
        f.vy += 0.155 * timeScale;
        f.x += f.vx * timeScale;
        f.y += f.vy * timeScale;
        f.rot += f.rotSpeed * timeScale;

        // Dropped unsliced fruit resets active combo streak
        if (f.y > 660) {
          if (!f.sliced && !f.isBomb && combo > 0) {
            combo = 0;
            document.getElementById('combo-val').textContent = '0x';
          }
          fruits.splice(i, 1);
        }
      }

      // Update Halves
      for (let i = fruitHalves.length - 1; i >= 0; i--) {
        const h = fruitHalves[i];
        h.vy += 0.18;
        h.x += h.vx;
        h.y += h.vy;
        h.rot += h.rotSpeed;
        if (h.y > 660) fruitHalves.splice(i, 1);
      }

      // Update Slash Points
      for (let i = slashPoints.length - 1; i >= 0; i--) {
        slashPoints[i].life -= 0.09;
        if (slashPoints[i].life <= 0) slashPoints.splice(i, 1);
      }

      // Render
      ctx.save();
      if (screenShake > 0) {
        ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
        screenShake *= 0.88;
        if (screenShake < 0.5) screenShake = 0;
      }

      ctx.fillStyle = '#070916'; ctx.fillRect(0, 0, 800, 600);

      // Subtle Background Matrix Grid
      ctx.strokeStyle = 'rgba(0,245,255,0.035)'; ctx.lineWidth = 1;
      for (let x=0; x<800; x+=60) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,600); ctx.stroke(); }
      for (let y=0; y<600; y+=60) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(800,y); ctx.stroke(); }

      // Draw Floating Whole Fruits
      fruits.forEach(f => {
        if (f.sliced) return;
        ctx.save();
        ctx.translate(f.x, f.y);
        ctx.rotate(f.rot);

        if (f.isBomb) {
          ctx.fillStyle = '#ff0055';
          ctx.shadowColor = '#ff0055'; ctx.shadowBlur = 22;
          ctx.beginPath(); ctx.arc(0, 0, f.r, 0, Math.PI*2); ctx.fill();
          ctx.fillStyle = '#fff'; ctx.font = '24px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText('💣', 0, 0);
        } else {
          ctx.fillStyle = f.color;
          ctx.shadowColor = f.color; ctx.shadowBlur = 20;
          ctx.beginPath(); ctx.arc(0, 0, f.r, 0, Math.PI*2); ctx.fill();
          ctx.fillStyle = f.inner;
          ctx.beginPath(); ctx.arc(0, 0, f.r * 0.75, 0, Math.PI*2); ctx.fill();
          ctx.fillStyle = '#fff'; ctx.font = '20px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(f.emoji, 0, 0);
        }
        ctx.restore();
      });

      // Draw Split Sliced Halves
      fruitHalves.forEach(h => {
        ctx.save();
        ctx.translate(h.x, h.y);
        ctx.rotate(h.rot);
        ctx.fillStyle = h.color;
        ctx.beginPath();
        ctx.arc(0, 0, h.r, h.side > 0 ? -Math.PI/2 : Math.PI/2, h.side > 0 ? Math.PI/2 : -Math.PI/2);
        ctx.fill();
        ctx.fillStyle = h.inner;
        ctx.beginPath();
        ctx.arc(0, 0, h.r * 0.7, h.side > 0 ? -Math.PI/2 : Math.PI/2, h.side > 0 ? Math.PI/2 : -Math.PI/2);
        ctx.fill();
        ctx.restore();
      });

      // Draw Popups
      for (let i = popups.length - 1; i >= 0; i--) {
        const pop = popups[i];
        pop.y -= 1.2; pop.life -= 0.025;
        if (pop.life <= 0) { popups.splice(i, 1); continue; }
        ctx.fillStyle = pop.color;
        ctx.globalAlpha = pop.life;
        ctx.font = 'bold 18px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(pop.text, pop.x, pop.y);
        ctx.globalAlpha = 1;
      }

      // Draw Katana Blade Slash Trail
      if (slashPoints.length > 1) {
        ctx.beginPath();
        ctx.moveTo(slashPoints[0].x, slashPoints[0].y);
        for (let i = 1; i < slashPoints.length; i++) {
          ctx.lineTo(slashPoints[i].x, slashPoints[i].y);
        }
        ctx.strokeStyle = 'rgba(0, 245, 255, 0.4)';
        ctx.lineWidth = 14;
        ctx.lineCap = 'round';
        ctx.shadowColor = '#00f5ff'; ctx.shadowBlur = 25;
        ctx.stroke();

        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 4;
        ctx.stroke();
        ctx.shadowBlur = 0;
      }

      // Draw Droplet Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy; p.life -= 0.035;
        if (p.life <= 0) { particles.splice(i, 1); continue; }
        ctx.fillStyle = p.color; ctx.globalAlpha = p.life;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
        ctx.globalAlpha = 1;
      }

      ctx.restore();
      requestAnimationFrame(loop);
    }

    function finishMatch() {
      gameActive = false;
      if (window.arcadeAudio) window.arcadeAudio.playTriumph();
      document.getElementById('modal-title').textContent = "TIME'S UP! ⏱️";
      document.getElementById('modal-sub').textContent = `FINAL SCORE: ${score.toLocaleString()} PTS | MAX COMBO: ${maxCombo}x`;
      document.getElementById('modal').style.display = 'flex';
      try {
        if (window.ArcadeLeaderboard) {
          window.ArcadeLeaderboard.submitScore('neon-katana-slash', score);
        }
      } catch(e){}
    }
  </script>
</body>
</html>
